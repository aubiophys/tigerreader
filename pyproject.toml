[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerreader"
version = "0.7.2"
description = "TigerReader: control and data acquisition for the BioTek FLx800 (fluorescence/luminescence) and Bio-Rad Model 680 (absorbance) microplate readers"
readme = "README.md"
requires-python = ">=3.8"   # core driver/CLI; GUI extras need Python >= 3.10 (recommended: 3.12)
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.6; python_version >= '3.10'", "pyqtgraph>=0.13; python_version >= '3.10'"]
dev = ["pytest>=8", "pytest-qt>=4", "ruff"]

[project.scripts]
flx800 = "tigerreader.cli:main"
m680 = "tigerreader.m680.cli:main"
tigerreader-shortcut = "tigerreader.winshortcut:main"

[project.gui-scripts]
tigerreader = "tigerreader.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
